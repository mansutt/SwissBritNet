name: Update Footer Date

on:
  push:
    branches:
      - gh-pages
  pull_request:
    branches:
      - gh-pages
  schedule:
    # Every 1 January at 06:00 UTC, so the copyright year rolls over even without a push
    - cron: '0 6 1 1 *'

jobs:
  update-footer-date:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set current date
        id: date
        run: |
          echo "date=$(date +"%d %B %Y")" >> $GITHUB_ENV
          echo "year=$(date +"%Y")" >> $GITHUB_ENV

      - name: Delay to prevent duplicate build triggers
        if: github.event_name != 'schedule'
        run: sleep 60  # Waits 60 seconds before updating to avoid multiple build triggers

      - name: Update Last Updated Date in Footer
        if: github.event_name != 'schedule'
        run: |
          current_date="${{ env.date }}"
          sed -i "s/Last updated on: [0-9]\{1,2\} [A-Za-z]* [0-9]\{4\}/Last updated on: $current_date/" templates/footer.html
        # 'env.date' is set earlier in the workflow and is valid in GitHub Actions -> ignore warning 

      - name: Update Copyright Year in Footer
        run: |
          current_year="${{ env.year }}"
          # Keeps the start year (2024) and replaces only the end year of the range
          sed -i "s/© \([0-9]\{4\}\)–[0-9]\{4\} SwissBritNet/© \1–$current_year SwissBritNet/" templates/footer.html

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add templates/footer.html
          git commit -m "[GitHub Actions]: Update footer date" || echo "No changes to commit"
    
      - name: Pull latest changes
        run: |
          git pull --rebase origin gh-pages

      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin gh-pages
